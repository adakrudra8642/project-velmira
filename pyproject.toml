[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "velmira"
version = "1.1.2"
description = "Velmira (VEL) — a local-first RAG assistant"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Rudra Adak", email = "adakrudra8642@gmail.com" }
]
keywords = ["rag", "llm", "local-ai", "privacy", "lancedb", "llama-cpp", "ai", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python==0.3.32",
    "lancedb==0.33.0",
    "docling==2.108.0",
    "python-dotenv==1.2.2",
]

[project.urls]
Repository = "https://github.com/adakrudra8642/project-velmira"

[tool.setuptools.packages.find]
where = ["src"]
