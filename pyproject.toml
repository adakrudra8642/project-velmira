[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velmira"
version = "1.2.3"
description = "Velmira (VEL) — a local-first RAG assistant"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rudra Adak", email = "adakrudra8642@gmail.com" }]
keywords = [
    "rag",
    "llm",
    "local-ai",
    "privacy",
    "lancedb",
    "llama-cpp",
    "ai",
    "assistant",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.3.35",
    "lancedb>=0.39.0",
    "docling>=2.130.0",
    "python-dotenv>=1.2.3",
]

[project.urls]
Repository = "https://github.com/adakrudra8642/project-velmira"

[tool.setuptools.packages.find]
where = ["src"]
